services:
  mysql:
    container_name: split_audio_mysql
    image: mysql:8
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - split-audio-mysql-data:/var/lib/mysql
    networks:
      - split-audio-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  split-audio-backend:
    container_name: split_audio_orchestrator
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${ORCHESTRATOR_SHARED_DIR}:${ORCHESTRATOR_SHARED_DIR}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - split-audio-net

volumes:
  split-audio-mysql-data:
    name: split-audio-mysql-data

networks:
  split-audio-net:
    name: split-audio-net