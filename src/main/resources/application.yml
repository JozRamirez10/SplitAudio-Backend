spring:
  application:
    name: split-audio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_REQUEST_SIZE:200MB}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:10000}
            read-timeout: ${FEIGN_READ_TIMEOUT:1800000}
      okhttp:
        enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        serverTimezone: ${TZ:America/Mexico_City}
        createDatabaseIfNotExist: true
        useSSL: false
        allowPublicKeyRetrieval: true
  jpa:
    open-in-view: false
    properties:
      "[hibernate.jdbc.time_zone]": ${TZ:America/Mexico_City}

server:
  port: ${PORT:8080}

app:
  orchestrator:
    shared_dir: ${ORCHESTRATOR_SHARED_DIR}
    split_audio:
      tmp_dir: ${SPLIT_AUDIO_TMP_DIR}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  cache:
    time-expiration-minutes: ${TIME_EXPIRATION_MINUTES:30}
    maximum-size: ${MAXIMUM_SIZE:500}

python:
  api:
    splitmetronome:
      url: ${SPLIT_METRONOME_URL}
    splitaudio:
      url: ${SPLIT_SPLITAUDIO_URL}
    storage:
      url: ${SPLIT_STORAGE_URL}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  expiration-hours: ${MINIO_EXPIRATION_HOURS:24}

metube:
  url: ${SPLIT_METUBE_URL}

---
# ==========================================
# PROFILE DEV 
# ==========================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      "[hibernate.format_sql]": true

---
# ==========================================
# PROFILE PROD 
# ==========================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false